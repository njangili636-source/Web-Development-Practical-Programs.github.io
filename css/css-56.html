<!DOCTYPE html>
<html>

<head>
    <title>Restaurant</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #fafafa;
        }
        
        header {
            background: #333;
            color: white;
            text-align: center;
            padding: 30px;
        }
        
        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }
        
        .item {
            width: 220px;
            padding: 20px;
            background: white;
            text-align: center;
            box-shadow: 0 0 8px gray;
        }
        
        .price {
            color: green;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Delicious Restaurant</h1>
        <p>Welcome to our restaurant</p>
    </header>

    <h2 style="text-align:center;">Our Menu</h2>

    <div class="menu">

        <div class="item">
            <h2>Pizza</h2>
            <p>Cheese Pizza</p>
            <p class="price">₹250</p>
        </div>

        <div class="item">
            <h2>Burger</h2>
            <p>Veg Burger</p>
            <p class="price">₹150</p>
        </div>

        <div class="item">
            <h2>Pasta</h2>
            <p>Italian Pasta</p>
            <p class="price">₹200</p>
        </div>

    </div>

    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
