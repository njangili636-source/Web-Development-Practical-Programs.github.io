<!DOCTYPE html>
<html>

<head>
    <title>Online Shopping</title>
    <style>
        body {
            font-family: Arial;
        }
        
        header {
            background: black;
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .products {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 30px;
        }
        
        .product {
            width: 220px;
            padding: 20px;
            text-align: center;
            border: 1px solid #ccc;
        }
        
        .product img {
            width: 200px;
            height: 150px;
            object-fit: cover;
        }
        
        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Shopping</h1>
    </header>

    <div class="products">

        <div class="product">
            <img src="https://picsum.photos/200/150">
            <h2>Watch</h2>
            <p>₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/201/150">
            <h2>Shoes</h2>
            <p>₹1499</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/202/150">
            <h2>Bag</h2>
            <p>₹799</p>
            <button>Buy Now</button>
        </div>

    </div>

    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
