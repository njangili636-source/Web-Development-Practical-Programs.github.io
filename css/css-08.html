<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Program 08</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        
        .box {
            float: left;
            width: 150px;
            height: 100px;
            background-color: lightblue;
            margin: 10px;
            padding: 20px;
        }
        
        .clear {
            clear: both;
            background-color: lightgreen;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Float and Clear</h1>

    <div class="box">
        Float Box 1
    </div>

    <div class="box">
        Float Box 2
    </div>

    <div class="clear">
        This section uses clear: both.
    </div>

</body>

</html>
