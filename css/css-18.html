<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Program 18</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        .box {
            width: 150px;
            height: 150px;
            background-color: lightblue;
            margin: 50px auto;
            animation: move 3s infinite alternate;
        }
        
        @keyframes move {
            from {
                transform: translateX(-100px);
            }
            to {
                transform: translateX(100px);
            }
        }
    </style>
</head>

<body>

    <h1>CSS Animation</h1>

    <div class="box"></div>

</body>

</html>
