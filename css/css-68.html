<!DOCTYPE html>
<html>

<head>
    <title>Loading Spinner</title>
    <style>
        .spinner {
            width: 60px;
            height: 60px;
            border: 8px solid #ddd;
            border-top: 8px solid black;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h1>CSS Loading Spinner</h1>

    <div class="spinner"></div>

    <p>Loading...</p>

    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
