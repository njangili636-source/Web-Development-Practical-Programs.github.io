<!DOCTYPE html>
<html>

<head>
    <title>Button Hover Animation</title>
    <style>
        button {
            padding: 15px 30px;
            background: black;
            color: white;
            border: none;
            transition: 0.4s;
        }
        
        button:hover {
            transform: scale(1.2);
            background: gray;
        }
    </style>
</head>

<body>

    <h1>CSS Button Hover Animation</h1>

    <button>Hover Me</button>
