<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Program 06</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        
        .fixed {
            width: 300px;
            height: 100px;
            background-color: lightblue;
            padding: 20px;
            margin: 20px;
        }
        
        .responsive {
            width: 80%;
            min-height: 100px;
            background-color: lightgreen;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>Width, Height and Sizing</h1>

    <div class="fixed">
        Fixed Width and Height
    </div>

    <div class="responsive">
        Responsive Width using Percentage
    </div>

</body>

</html>
