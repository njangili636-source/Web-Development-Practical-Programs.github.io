<!DOCTYPE html>
<html>

<head>
    <title>CSS Modal Popup</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }
        
        .modal-content {
            background: white;
            width: 300px;
            margin: 150px auto;
            padding: 30px;
            text-align: center;
        }
        
        #open:checked+.modal {
            display: block;
        }
        
        label {
            display: inline-block;
            background: black;
            color: white;
            padding: 12px 20px;
            cursor: pointer;
        }
        
        input {
            display: none;
        }
    </style>
</head>

<body>

    <h1>CSS-Only Modal Popup</h1>

    <input type="checkbox" id="open">

    <label for="open">Open Popup</label>

    <div class="modal">
        <div class="modal-content">
            <h2>Hello!</h2>
            <p>This popup is created using only CSS.</p>

            <label for="open">Close</label>
        </div>
    </div>

    <br><br>
    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
