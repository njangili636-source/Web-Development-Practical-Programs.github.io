<!DOCTYPE html>
<html>

<head>
    <title>Dark Mode</title>

    <style>
         :root {
            --background: white;
            --text: black;
            --box: #eeeeee;
        }
        
        body {
            background: var(--background);
            color: var(--text);
            font-family: Arial;
            text-align: center;
        }
        
        .box {
            background: var(--box);
            padding: 40px;
            margin: 40px;
        }
        
        @media (prefers-color-scheme: dark) {
             :root {
                --background: #222;
                --text: white;
                --box: #444;
            }
        }
    </style>
</head>

<body>

    <h1>Dark Mode</h1>

    <div class="box">
        <h2>CSS Variables</h2>
        <p>This page supports dark mode.</p>
    </div>

    <a href="index.html">Back to Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>

</html>
