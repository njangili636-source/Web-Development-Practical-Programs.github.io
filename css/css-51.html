<!DOCTYPE html>
<html>

<head>
    <title>Fixed Sidebar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100%;
            background: #333;
            padding-top: 20px;
        }
        
        .sidebar a {
            display: block;
            color: white;
            padding: 15px;
            text-decoration: none;
        }
        
        .content {
            margin-left: 220px;
            padding: 30px;
            height: 800px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>

    <div class="content">
        <h1>Fixed Sidebar</h1>
        <p>The sidebar remains fixed while scrolling.</p>
        <p>Scroll down to see the effect.</p>
    </div>

    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
