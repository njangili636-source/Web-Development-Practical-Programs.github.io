<!DOCTYPE html>
<html>

<head>
    <title>News Blog Grid</title>
    <style>
        .news {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        
        .article {
            padding: 20px;
            border: 1px solid gray;
            background: #f5f5f5;
        }
        
        @media (max-width: 700px) {
            .news {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>News and Blog</h1>

    <div class="news">

        <div class="article">
            <h2>Technology</h2>
            <p>Latest technology updates.</p>
        </div>

        <div class="article">
            <h2>Education</h2>
            <p>New education trends.</p>
        </div>

        <div class="article">
            <h2>Sports</h2>
            <p>Latest sports news.</p>
        </div>

    </div>

    <br>
    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
