<!DOCTYPE html>
<html>

<head>
    <title>Two Column Grid</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        
        .left,
        .right {
            padding: 30px;
            border: 1px solid gray;
        }
        
        .left {
            background: #eee;
        }
        
        .right {
            background: #ddd;
        }
    </style>
</head>

<body>

    <h1>Two Column Grid</h1>

    <div class="container">

        <div class="left">
            <h2>Sidebar</h2>
            <p>Menu items</p>
        </div>

        <div class="right">
            <h2>Main Content</h2>
            <p>This is the main content area.</p>
        </div>

    </div>

    <br>
    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
