<!DOCTYPE html>
<html>

<head>
    <title>Flexbox Cards</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .card {
            width: 200px;
            padding: 25px;
            background: #eee;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Flexbox Card Layout</h1>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Webpage structure</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Webpage styling</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Webpage functionality</p>
        </div>

    </div>

    <a href="../index.html">Home</a>

</body>

</html>
