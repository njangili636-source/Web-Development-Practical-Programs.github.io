<!DOCTYPE html>
<html>

<head>
    <title>Responsive Contact Form</title>
    <style>
        body {
            font-family: Arial;
        }
        
        form {
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            border: 1px solid gray;
        }
        
        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        
        textarea {
            height: 120px;
        }
        
        button {
            padding: 12px 25px;
            background: black;
            color: white;
            border: none;
        }
        
        @media (max-width: 600px) {
            form {
                margin: 20px;
            }
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">Contact Us</h1>

    <form>
        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Message</label>
        <textarea placeholder="Enter your message"></textarea>

        <button>Send Message</button>
    </form>

    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
