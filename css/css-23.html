<!DOCTYPE html>
<html>

<head>
    <title>Product Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }
        
        .product {
            width: 300px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        
        .product img {
            width: 200px;
            height: 150px;
            object-fit: cover;
        }
        
        .price {
            color: green;
            font-size: 22px;
        }
        
        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="product">

        <img src="https://picsum.photos/300/200" alt="Product">

        <h2>Smart Watch</h2>

        <p>Modern smart watch with useful features.</p>

        <p class="price">₹1999</p>

        <button>Buy Now</button>

    </div>

    <a href="index.html">Back to Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>

</html>
