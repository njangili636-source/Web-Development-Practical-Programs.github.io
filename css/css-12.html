<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Program 12</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        
        ul {
            list-style-type: square;
        }
        
        li {
            margin: 10px;
        }
        
        table {
            border-collapse: collapse;
            width: 70%;
        }
        
        th,
        td {
            border: 2px solid black;
            padding: 12px;
            text-align: center;
        }
        
        th {
            background-color: lightblue;
        }
        
        tr:nth-child(even) {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h1>CSS Lists and Tables</h1>

    <h2>Styled List</h2>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ul>

    <h2>Styled Table</h2>

    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Course</th>
        </tr>

        </tr>

        </tr>

        <tr>
            <td>103</td>

        </tr>
    </table>

</html>
