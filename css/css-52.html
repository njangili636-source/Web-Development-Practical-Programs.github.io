<!DOCTYPE html>
<html>

<head>
    <title>Responsive Footer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        
        .content {
            min-height: 500px;
            padding: 30px;
        }
        
        footer {
            background: #333;
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-around;
        }
        
        @media (max-width: 600px) {
            footer {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="content">
        <h1>Responsive Footer</h1>
        <p>Resize the browser window to see the responsive footer.</p>
    </div>

    <footer>
        <div>
            <h3>About</h3>
            <p>My Website</p>
        </div>

        <div>
            <h3>Contact</h3>
            <p>example@email.com</p>
        </div>

        <div>
            <h3>Follow</h3>
            <p>Facebook | Instagram</p>
        </div>
    </footer>

    <br>
    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
