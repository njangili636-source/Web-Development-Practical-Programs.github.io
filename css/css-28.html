<!DOCTYPE html>
<html>

<head>
    <title>CSS Combinators</title>

    <style>
        .box p {
            color: blue;
        }
        
        .box>h2 {
            color: green;
        }
        
        h2+p {
            background: yellow;
        }
        
        h2~p {
            padding: 5px;
        }
    </style>
</head>

<body>

    <h1>CSS Combinators</h1>

    <div class="box">

        <h2>Combinator Example</h2>

        <p>First paragraph</p>
        <p>Second paragraph</p>

    </div>

    <a href="index.html">Back to Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>

</html>
