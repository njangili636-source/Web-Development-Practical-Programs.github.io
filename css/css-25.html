<!DOCTYPE html>
<html>

<head>
    <title>Website Homepage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        
        header {
            background: black;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        nav {
            background: #333;
            text-align: center;
            padding: 15px;
        }
        
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }
        
        .hero {
            text-align: center;
            padding: 80px;
            background: #eee;
        }
        
        .content {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }
        
        .box {
            padding: 30px;
            background: #f2f2f2;
            text-align: center;
        }
        
        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="hero">
        <h1>Welcome to My Website</h1>
        <p>Learn HTML, CSS and JavaScript</p>
    </div>

    <div class="content">

        <div class="box">
            <h2>HTML</h2>
            <p>Learn webpage structure.</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>Learn webpage styling.</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>Learn webpage functionality.</p>
        </div>

    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <br>

    <a href="index.html">Back to Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>

</html>
