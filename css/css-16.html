<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Program 16</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }
        
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 30px;
        }
        
        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }
        
        .box {
            flex: 1;
            background-color: lightblue;
            padding: 30px;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
            .box {
                width: auto;
            }
            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Webpage</h1>
    </header>

    <div class="container">

        <div class="box">HTML</div>
        <div class="box">CSS</div>
        <div class="box">JavaScript</div>

    </div>

    <a href="index.html">Back to Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>

</html>
