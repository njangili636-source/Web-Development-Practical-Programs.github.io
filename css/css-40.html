<!DOCTYPE html>
<html>

<head>
    <title>Image Hover Effect</title>
    <style>
        img {
            width: 400px;
            transition: 0.5s;
        }
        
        img:hover {
            transform: scale(1.1);
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <h1>Image Hover Effect</h1>

    <img src="https://picsum.photos/400/250" alt="Sample Image">

    <p>Move the mouse over the image.</p>

    <a href="../index.html">Home</a>

</body>

</html>
