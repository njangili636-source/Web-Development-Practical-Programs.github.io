<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Program 01</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            color: green;
            text-align: center;
        }
        
        .internal {
            color: red;
            font-size: 20px;
            padding: 15px;
            border: 2px solid red;
        }
    </style>

</head>

<body>

    <h1>Inline, Internal and External CSS</h1>

    <!-- Inline CSS -->
    <h2 style="color: purple; text-align: center;">
        Inline CSS Example
    </h2>

    <p style="color: orange; font-size: 18px;">
        This paragraph is styled using Inline CSS.
    </p>


    <!-- Internal CSS -->
    <h2>Internal CSS Example</h2>

    <p class="internal">
        This paragraph is styled using Internal CSS.
    </p>


    <!-- External CSS -->
    <h2>External CSS Example</h2>

    <p class="external">
        This paragraph is styled using External CSS.
    </p>


    <br>

    <a href="index.html">Back to Programs</a>

    <br><br>

    <a href="../index.html">Home</a>

</body>

</html>
