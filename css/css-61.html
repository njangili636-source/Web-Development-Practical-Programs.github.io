<!DOCTYPE html>
<html>

<head>
    <title>Grid Template Areas</title>
    <style>
        .container {
            display: grid;
            grid-template-areas: "header header" "sidebar main" "footer footer";
            grid-template-columns: 200px 1fr;
            gap: 10px;
        }
        
        header {
            grid-area: header;
            background: lightblue;
            padding: 30px;
            text-align: center;
        }
        
        aside {
            grid-area: sidebar;
            background: lightgreen;
            padding: 30px;
        }
        
        main {
            grid-area: main;
            background: #eee;
            padding: 30px;
        }
        
        footer {
            grid-area: footer;
            background: lightgray;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Grid Template Areas</h1>

    <div class="container">
        <header>Header</header>
        <aside>Sidebar</aside>
        <main>Main Content</main>
        <footer>Footer</footer>
    </div>

    <br>
    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
