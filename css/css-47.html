<!DOCTYPE html>
<html>

<head>
    <title>Grid Dashboard</title>
    <style>
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        
        .box {
            padding: 40px;
            background: #eee;
            text-align: center;
            border: 1px solid gray;
        }
    </style>
</head>

<body>

    <h1>Grid Dashboard</h1>

    <div class="dashboard">
        <div class="box">Students</div>
        <div class="box">Courses</div>
        <div class="box">Teachers</div>
        <div class="box">Exams</div>
        <div class="box">Results</div>
        <div class="box">Library</div>
    </div>

    <br>
    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
