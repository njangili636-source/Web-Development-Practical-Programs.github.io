<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Program 02</title>

    <style>
        * {
            font-family: Arial, sans-serif;
        }
        
        h1 {
            color: blue;
        }
        
        .text {
            color: green;
        }
        
        #special {
            color: red;
        }
        
        input[type="text"] {
            border: 2px solid purple;
            padding: 8px;
        }
        
        h2,
        p {
            margin: 15px;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Element Selector</h2>
    <p>This paragraph uses an element selector.</p>

    <p class="text">This uses a class selector.</p>

    <p id="special">This uses an ID selector.</p>

    <input type="text" placeholder="Attribute selector">

</body>

</html>
