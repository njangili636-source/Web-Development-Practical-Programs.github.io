<!DOCTYPE html>
<html>

<head>
    <title>CSS Transitions</title>
    <style>
        .box {
            width: 150px;
            height: 150px;
            background: lightblue;
            transition: width 1s, height 1s;
        }
        
        .box:hover {
            width: 300px;
            height: 200px;
        }
    </style>
</head>

<body>

    <h1>CSS Transitions</h1>

    <div class="box"></div>

    <p>Move the mouse over the box.</p>

</body>

</html>
