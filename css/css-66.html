<!DOCTYPE html>
<html>

<head>
    <title>2D and 3D Transformations</title>
    <style>
        .box {
            width: 150px;
            height: 100px;
            background: lightblue;
            margin: 40px;
            padding: 20px;
            text-align: center;
        }
        
        .rotate {
            transform: rotate(10deg);
        }
        
        .scale {
            transform: scale(1.2);
        }
        
        .move {
            transform: translateX(50px);
        }
    </style>
</head>

<body>

    <h1>CSS Transformations</h1>

    <div class="box rotate">Rotate</div>
    <div class="box scale">Scale</div>
    <div class="box move">Translate</div>

    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
