<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Program 09</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        nav {
            background-color: #333;
            padding: 15px;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
        }
        
        nav a:hover {
            background-color: #555;
        }
        
        .content {
            padding: 30px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">

        <h1>CSS Navigation Bar</h1>

        <p>
            This webpage demonstrates a styled navigation bar.
        </p>

    </div>

    <a href="index.html">Back to Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>

</html>
