    <title>Border Radius</title>
    <style>
        .square {
            width: 150px;
            height: 150px;
            background: lightblue;
            border-radius: 20px;
        }
        
        .circle {
            width: 150px;
            height: 150px;
            background: lightgreen;
            border-radius: 50%;
        }
    </style>
</head>

<body>
