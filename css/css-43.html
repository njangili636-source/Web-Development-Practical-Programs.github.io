<!DOCTYPE html>
<html>

<head>
    <title>CSS Filters</title>
    <style>
        img {
            width: 300px;
            margin: 10px;
        }
        
        .blur {
            filter: blur(3px);
        }
        
        .gray {
            filter: grayscale(100%);
        }
        
        .bright {
            filter: brightness(150%);
        }
        
        .contrast {
            filter: contrast(200%);
        }
    </style>
</head>

<body>

    <h1>CSS Image Filters</h1>

    <img class="blur" src="https://picsum.photos/300/200">
    <img class="gray" src="https://picsum.photos/301/200">
    <img class="bright" src="https://picsum.photos/302/200">
    <img class="contrast" src="https://picsum.photos/303/200">

    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
