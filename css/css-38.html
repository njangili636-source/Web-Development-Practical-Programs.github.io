<!DOCTYPE html>
<html>

<head>
    <title>Visibility</title>
    <style>
        .visible {
            background: lightgreen;
            padding: 20px;
        }
        
        .hidden {
            background: lightcoral;
            padding: 20px;
            visibility: hidden;
        }
    </style>
</head>

<body>

    <h1>Visibility and Hiding</h1>

    <div class="visible">This element is visible.</div>

    <div class="hidden">This element is hidden.</div>

    <p>The hidden element still occupies space.</p>

</body>

</html>
