<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Program 17</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        .box {
            width: 150px;
            height: 150px;
            background-color: lightblue;
            margin: 50px auto;
            transition: 0.5s;
        }
        
        .box:hover {
            transform: scale(1.2) rotate(10deg);
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>CSS Transitions and Transformations</h1>

    <div class="box">
        Hover Me
    </div>

    <a href="index.html">Back to Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>

</html>
