<!DOCTYPE html>
<html>

<head>
    <title>Opacity</title>
    <style>
        .normal {
            background: blue;
            color: white;
            padding: 30px;
        }
        
        .transparent {
            background: blue;
            color: white;
            padding: 30px;
            opacity: 0.4;
        }
    </style>
</head>

<body>

    <h1>Opacity and Transparency</h1>

    <div class="normal">Normal Element</div>
    <br>
    <div class="transparent">Transparent Element</div>
