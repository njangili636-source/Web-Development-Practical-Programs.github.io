<!DOCTYPE html>
<html>

<head>
    <title>Sticky Header</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        
        header {
            position: sticky;
            top: 0;
            background: black;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .content {
            height: 1200px;
            padding: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Sticky Header</h1>
    </header>

    <div class="content">
        <h2>Scroll Down</h2>
        <p>The header remains at the top while scrolling.</p>
        <p>This demonstrates position: sticky.</p>
    </div>

    <a href="../index.html">Home</a>

</body>

</html>
