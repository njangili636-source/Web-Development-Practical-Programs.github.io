<!DOCTYPE html>
<html>

<head>
    <title>CSS Selectors</title>

    <style>
        * {
            font-family: Arial;
        }
        
        h1 {
            color: blue;
        }
        
        .student {
            color: green;
        }
        
        #special {
            color: red;
        }
        
        input[type="text"] {
            border: 2px solid blue;
        }
        
        h2,
        p {
            background: #eee;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Element Selector</h2>

    <p class="student">Class Selector</p>

    <p id="special">ID Selector</p>

    <input type="text" placeholder="Attribute Selector">

</body>

</html>
