<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Program 11</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        
        h1::before {
            content: "★ ";
        }
        
        h1::after {
            content: " ★";
        }
        
        p::first-letter {
            font-size: 40px;
            font-weight: bold;
        }
        
        .intro::first-line {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>CSS Pseudo-elements</h1>

    <p class="intro">
        This is an example of first-letter and first-line pseudo-elements in CSS.
    </p>

    <p>
        CSS pseudo-elements are used to style specific parts of an element.
    </p>

</body>

</html>
