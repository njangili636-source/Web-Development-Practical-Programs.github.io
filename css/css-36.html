<!DOCTYPE html>
<html>

<head>
    <title>Z Index</title>
    <style>
        .box1 {
            width: 150px;
            height: 150px;
            background: red;
            position: absolute;
            top: 100px;
            left: 100px;
            z-index: 1;
        }
        
        .box2 {
            width: 150px;
            height: 150px;
            background: blue;
            position: absolute;
            top: 150px;
            left: 150px;
            z-index: 2;
        }
    </style>
</head>

<body>

    <h1>Z-Index Example</h1>

    <div class="box1"></div>
    <div class="box2"></div>

    <a href="../index.html">Home</a>

</body>

</html>
