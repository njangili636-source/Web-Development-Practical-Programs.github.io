<!DOCTYPE html>
<html>

<head>
    <title>Inheritance and Specificity</title>

    <style>
        body {
            font-family: Arial;
            color: blue;
        }
        
        p {
            color: green;
        }
        
        .special {
            color: orange;
        }
        
        #unique {
            color: red;
        }
    </style>
</head>

<body>

    <h1>CSS Inheritance and Specificity</h1>

    <p>This paragraph uses element selector.</p>

    <p class="special">This paragraph uses class selector.</p>

    <p id="unique" class="special">
        This paragraph uses ID selector.
    </p>

</html>
