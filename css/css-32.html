<!DOCTYPE html>
<html>

<head>
    <title>Shadow Effects</title>
    <style>
        .box {
            width: 300px;
            padding: 30px;
            margin: 40px auto;
            text-align: center;
            background: white;
            box-shadow: 5px 5px 15px gray;
        }
        
        h1 {
            text-shadow: 3px 3px 5px gray;
        }
    </style>
</head>

<body>

    <h1>CSS Shadow Effects</h1>

    <div class="box">
        <h2>Box Shadow</h2>
        <p>This box has a shadow.</p>
    </div>

    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
