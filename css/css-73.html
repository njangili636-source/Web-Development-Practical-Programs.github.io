<!DOCTYPE html>
<html>

<head>
    <title>CSS Clamp Min Max</title>

    <style>
        .box {
            width: min(80%, 500px);
            min-height: 200px;
            padding: 30px;
            margin: 30px auto;
            background: lightblue;
            text-align: center;
        }
        
        h1 {
            font-size: clamp(25px, 5vw, 50px);
        }
        
        p {
            width: max(50%, 300px);
            margin: auto;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>CSS Sizing Functions</h1>

        <p>
            This example demonstrates clamp(), min() and max().
        </p>

    </div>

    <br><br>
    <a href="../index.html">Home</a>

</body>

</html>
