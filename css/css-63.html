<!DOCTYPE html>
<html>

<head>
    <title>Grid and Media Queries</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        
        .box {
            background: #eee;
            padding: 40px;
            text-align: center;
        }
        
        @media (max-width: 800px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 500px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Grid with Media Queries</h1>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

    <br>
    <a href="index.html">Back to Programs</a><br><br>
    <a href="../index.html">Home</a>

</body>

</html>
