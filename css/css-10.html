<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Program 10</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        
        a {
            color: blue;
        }
        
        a:hover {
            color: red;
        }
        
        a:active {
            color: green;
        }
        
        a:visited {
            color: purple;
        }
        
        input:focus {
            border: 3px solid blue;
            outline: none;
        }
        
        button:hover {
            background-color: green;
            color: white;
        }
        
        button:active {
            background-color: red;
        }
        
        input {
            padding: 10px;
        }
        
        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Pseudo-classes</h1>

    <h2>:hover</h2>

    <a href="https://www.google.com" target="_blank">
        Move mouse over this link
    </a>

    <h2>:focus</h2>

    <input type="text" placeholder="Click here and type">

    <h2>:active</h2>

    <button>Click Me</button>

    <h2>:visited</h2>

    <p>
        After visiting the link, its color changes.
    </p>

    <br>

    <a href="index.html">Back to Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>

</html>
