<!DOCTYPE html>
<html>

<head>
    <title>Responsive Typography</title>

    <style>
        body {
            font-family: Arial;
        }
        
        h1 {
            font-size: 8vw;
            text-align: center;
        }
        
        p {
            font-size: 3vw;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 40px;
            }
            p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Typography</h1>

    <p>Resize the browser window to see the text size change.</p>

    <br><br>
    <a href="../index.html">Home</a>

</body>

</html>
