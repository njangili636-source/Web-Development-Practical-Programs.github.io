<!DOCTYPE html>
<html>

<head>
    <title>CSS Calc</title>

    <style>
        .container {
            width: calc(100% - 40px);
            margin: 20px;
            background: #eeeeee;
            padding: 30px;
            box-sizing: border-box;
        }
        
        .box {
            width: calc(50% - 20px);
            padding: 30px;
            background: lightblue;
            display: inline-block;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>CSS calc() Function</h1>

    <div class="container">

        <div class="box">
            Box 1
        </div>

        <div class="box">
            Box 2
        </div>

    </div>

    <a href="../index.html">Home</a>

</body>

</html>
