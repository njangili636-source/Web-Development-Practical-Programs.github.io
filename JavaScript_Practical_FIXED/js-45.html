<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>45. localStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 25px;
        }
        
        .box {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #bbb;
        }
        
        input,
        button {
            padding: 10px;
            margin: 5px;
            font-size: 15px;
        }
        
        button {
            cursor: pointer;
        }
        
        .output {
            margin-top: 15px;
            padding: 12px;
            background: #eee;
            border-radius: 6px;
            min-height: 20px;
        }
        
        nav {
            margin-top: 25px;
        }
        
        nav a {
            margin-right: 18px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>45. localStorage</h1>

        <p>Save and retrieve a value using localStorage.</p>

        <input type="text" id="name" value="Ravi">

        <button onclick="saveData()">Save</button>

        <button onclick="loadData()">Load</button>

        <div id="out" class="output"></div>

        <nav>
            <a href="index.html">Back to Programs</a>
            <a href="../index.html">Home</a>
        </nav>

    </div>

    <script>
        const nameInput = document.getElementById("name");
        const output = document.getElementById("out");

        function saveData() {

            localStorage.setItem("studentName", nameInput.value);

            output.textContent = "Saved";
        }

        function loadData() {

            const savedName = localStorage.getItem("studentName");

            if (savedName) {
                output.textContent = "Saved value: " + savedName;
            } else {
                output.textContent = "No saved value";
            }
        }
    </script>

</body>

</html>
