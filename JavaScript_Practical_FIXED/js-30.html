<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>30. Form Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 25px;
        }
        
        .box {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #bbb;
        }
        
        input {
            padding: 10px;
            margin: 5px;
            font-size: 15px;
        }
        
        button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 15px;
            cursor: pointer;
        }
        
        .output {
            margin-top: 15px;
            padding: 12px;
            background: #eee;
            border-radius: 6px;
            min-height: 20px;
        }
        
        nav {
            margin-top: 25px;
        }
        
        nav a {
            margin-right: 18px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>30. Form Validation</h1>

        <p>Validate a required name field.</p>

        <form id="myForm">

            <input type="text" id="name" placeholder="Enter your name">

            <button type="submit">Submit</button>

        </form>

        <div id="out" class="output"></div>

        <nav>
            <a href="index.html">Back to Programs</a>
            <a href="../index.html">Home</a>
        </nav>

    </div>

    <script>
        const form = document.getElementById("myForm");
        const nameInput = document.getElementById("name");
        const output = document.getElementById("out");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const name = nameInput.value.trim();

            if (name === "") {

                output.textContent = "Please enter name";

            } else {

                output.textContent = "Valid form";

            }

        });
    </script>

</body>

</html>
