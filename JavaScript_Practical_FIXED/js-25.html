<body><div class="box">
<h1>25. Show / Hide HTML Element</h1>
<p>Show and hide an HTML element.</p>
<p id="box">This paragraph can be hidden.</p><button onclick="box.style.display=box.style.display==='none'?'block':'none'">Show / Hide</button>
