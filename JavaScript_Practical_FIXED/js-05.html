<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5. Positive, Negative or Zero</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:25px}
.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px #bbb}
input,button,select,textarea{padding:9px;margin:5px;font-size:15px}
button{cursor:pointer}
.output{margin-top:15px;padding:12px;background:#eee;border-radius:6px;min-height:20px}
nav{margin-top:25px}
nav a{margin-right:18px}
</style>
</head>
<body><div class="box">
<h1>5. Positive, Negative or Zero</h1>
<p>Check the sign of a number.</p>
<input id="n" type="number" value="-7"><button onclick="run()">Run Program</button><div id="out" class="output"></div>
<nav><a href="index.html">Back to Programs</a> <a href="../index.html">Home</a></nav>
</div>
<script>function run(){let n=+document.getElementById('n').value;out.textContent=n>0?'Positive':n<0?'Negative':'Zero'}</script>
</body>
</html>
