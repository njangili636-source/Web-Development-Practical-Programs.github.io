<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8. Prime Number</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:25px}
.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px #bbb}
input,button,select,textarea{padding:9px;margin:5px;font-size:15px}
button{cursor:pointer}
.output{margin-top:15px;padding:12px;background:#eee;border-radius:6px;min-height:20px}
nav{margin-top:25px}
nav a{margin-right:18px}
</style>
</head>
<body><div class="box">
<h1>8. Prime Number</h1>
<p>Check whether a number is prime.</p>
<input id="n" type="number" value="17"><button onclick="run()">Run Program</button><div id="out" class="output"></div>
<nav><a href="index.html">Back to Programs</a> <a href="../index.html">Home</a></nav>
</div>
<script>function run(){let n=+document.getElementById('n').value,p=n>1;for(let i=2;i<=Math.sqrt(n);i++)if(n%i===0)p=false;out.textContent=p?'Prime Number':'Not a Prime Number'}</script>
</body>
</html>
