<title>35. Stopwatch</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:25px}
.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px #bbb}
input,button,select,textarea{padding:9px;margin:5px;font-size:15px}
button{cursor:pointer}
.output{margin-top:15px;padding:12px;background:#eee;border-radius:6px;min-height:20px}

</style>
</head>
<body><div class="box">
<h1>35. Stopwatch</h1>
<p>Start, stop and reset a stopwatch.</p>
<h2 id="time">0 seconds</h2><button onclick="start()">Start</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button>
<nav><a href="index.html">Back to Programs</a> <a href="../index.html">Home</a></nav>
</div>
<script>let sec=0,t;function show(){time.textContent=sec+' seconds'}function start(){if(!t)t=setInterval(()=>{sec++;show()},1000)}function stop(){clearInterval(t);t=null}function reset(){stop();sec=0;show()}</script>
</body>
</html>
