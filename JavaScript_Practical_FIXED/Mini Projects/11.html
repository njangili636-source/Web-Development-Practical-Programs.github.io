<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11. Student Marks / Grade Calculator</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:25px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{color:#333} button{padding:9px 14px;margin:5px;cursor:pointer;border:0;border-radius:6px;background:#333;color:white}
input,select,textarea{padding:9px;margin:5px;width:auto;max-width:95%}
.output{margin-top:15px;padding:12px;background:#f0f0f0;border-radius:8px}
a{color:#333}
nav{margin-top:25px;padding-top:15px;border-top:1px solid #ddd}
</style>
</head>
<body><div class="container">
<h1>11. Student Marks / Grade Calculator</h1>

<input id="m1" type="number" placeholder="Subject 1"><input id="m2" type="number" placeholder="Subject 2"><input id="m3" type="number" placeholder="Subject 3"><button onclick="calc()">Calculate</button><div id="out" class="output"></div>
<script>function calc(){let a=[+m1.value,+m2.value,+m3.value];if(a.some(x=>x<0||x>100))return out.textContent='Enter marks from 0 to 100.';let t=a.reduce((x,y)=>x+y,0),avg=t/3,g=avg>=90?'A':avg>=75?'B':avg>=60?'C':avg>=50?'D':'F';out.textContent=`Total: ${t} | Average: ${avg.toFixed(2)} | Grade: ${g}`}</script>
<nav><a href="index.html">← Back to Mini Projects</a> | <a href="../index.html">← Back to JavaScript Programs</a></nav>
</div></body></html>
