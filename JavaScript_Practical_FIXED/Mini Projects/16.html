<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16. Currency Converter using API</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:25px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{color:#333} button{padding:9px 14px;margin:5px;cursor:pointer;border:0;border-radius:6px;background:#333;color:white}
input,select,textarea{padding:9px;margin:5px;width:auto;max-width:95%}
.output{margin-top:15px;padding:12px;background:#f0f0f0;border-radius:8px}
a{color:#333}
nav{margin-top:25px;padding-top:15px;border-top:1px solid #ddd}
</style>
</head>
<body><div class="container">
<h1>16. Currency Converter using API</h1>

<input id="amount" type="number" value="1"><input id="from" value="USD" maxlength="3"><input id="to" value="EUR" maxlength="3"><button onclick="convert()">Convert</button><div id="out" class="output"></div>
<script>async function convert(){out.textContent='Loading...';try{let a=+amount.value,f=from.value.trim().toUpperCase(),t=to.value.trim().toUpperCase();let d=await fetch(`https://api.frankfurter.app/latest?amount=${a}&from=${f}&to=${t}`).then(r=>r.json());if(!d.rates||d.rates[t]===undefined)throw Error();out.textContent=`${a} ${f} = ${d.rates[t]} ${t}`}catch(e){out.textContent='Conversion failed. Check currency codes and internet connection.'}}</script>
<nav><a href="index.html">← Back to Mini Projects</a> | <a href="../index.html">← Back to JavaScript Programs</a></nav>
</div></body></html>
