<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1. Digital Calculator</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:25px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{color:#333} button{padding:9px 14px;margin:5px;cursor:pointer;border:0;border-radius:6px;background:#333;color:white}
input,select,textarea{padding:9px;margin:5px;width:auto;max-width:95%}
.output{margin-top:15px;padding:12px;background:#f0f0f0;border-radius:8px}
a{color:#333}
nav{margin-top:25px;padding-top:15px;border-top:1px solid #ddd}
</style>
</head>
<body><div class="container">
<h1>1. Digital Calculator</h1>

<input id="a" type="number" placeholder="Number 1">
<input id="b" type="number" placeholder="Number 2"><br>
<button onclick="calc('+')">+</button><button onclick="calc('-')">−</button>
<button onclick="calc('*')">×</button><button onclick="calc('/')">÷</button>
<div class="output" id="out">Result: </div>
<script>
function calc(op){let a=Number(document.getElementById('a').value),b=Number(document.getElementById('b').value);
if(op==='/'&&b===0)return out.textContent='Cannot divide by zero';
out.textContent='Result: '+({'+':a+b,'-':a-b,'*':a*b,'/':a/b}[op]);}
</script>

</div></body></html>
