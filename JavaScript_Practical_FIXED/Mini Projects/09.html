<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9. Tic-Tac-Toe Game</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:25px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{color:#333} button{padding:9px 14px;margin:5px;cursor:pointer;border:0;border-radius:6px;background:#333;color:white}
input,select,textarea{padding:9px;margin:5px;width:auto;max-width:95%}
.output{margin-top:15px;padding:12px;background:#f0f0f0;border-radius:8px}
a{color:#333}
nav{margin-top:25px;padding-top:15px;border-top:1px solid #ddd}
</style>
</head>
<body><div class="container">
<h1>9. Tic-Tac-Toe Game</h1>

<div id="board" style="display:grid;grid-template-columns:repeat(3,80px);gap:5px"></div><h3 id="msg">Player X</h3><button onclick="resetGame()">Reset</button>
<script>let cells=Array(9).fill(''),player='X',game=true;function draw(){board.innerHTML=cells.map((x,i)=>`<button style="height:80px;font-size:30px" onclick="play(${i})">${x}</button>`).join('')}function play(i){if(!game||cells[i])return;cells[i]=player;if(win()){msg.textContent=player+' wins!';game=false}else if(cells.every(Boolean)){msg.textContent='Draw!';game=false}else{player=player==='X'?'O':'X';msg.textContent='Player '+player}draw()}function win(){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>a.every(i=>cells[i]===player))}function resetGame(){cells=Array(9).fill('');player='X';game=true;msg.textContent='Player X';draw()}draw()</script>

</div></body></html>
