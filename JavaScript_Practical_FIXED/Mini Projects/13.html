<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>13. Notes Application using localStorage</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:25px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{color:#333} button{padding:9px 14px;margin:5px;cursor:pointer;border:0;border-radius:6px;background:#333;color:white}
input,select,textarea{padding:9px;margin:5px;width:auto;max-width:95%}
.output{margin-top:15px;padding:12px;background:#f0f0f0;border-radius:8px}
a{color:#333}
nav{margin-top:25px;padding-top:15px;border-top:1px solid #ddd}
</style>
</head>
<body><div class="container">
<h1>13. Notes Application using localStorage</h1>

<textarea id="note" rows="8" style="width:90%" placeholder="Write your note"></textarea><br><button onclick="save()">Save</button><button onclick="load()">Load</button><button onclick="clearNote()">Clear</button><div id="out" class="output"></div>
<script>function save(){localStorage.setItem('miniNote',note.value);out.textContent='Note saved.'}function load(){out.textContent=localStorage.getItem('miniNote')||'No saved note.';note.value=localStorage.getItem('miniNote')||''}function clearNote(){localStorage.removeItem('miniNote');note.value='';out.textContent='Note cleared.'}</script>
<nav><a href="index.html">← Back to Mini Projects</a> | <a href="../index.html">← Back to JavaScript Programs</a></nav>
</div></body></html>
