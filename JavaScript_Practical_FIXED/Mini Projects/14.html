<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14. Random Password Generator</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:25px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{color:#333} button{padding:9px 14px;margin:5px;cursor:pointer;border:0;border-radius:6px;background:#333;color:white}
input,select,textarea{padding:9px;margin:5px;width:auto;max-width:95%}
.output{margin-top:15px;padding:12px;background:#f0f0f0;border-radius:8px}
a{color:#333}
nav{margin-top:25px;padding-top:15px;border-top:1px solid #ddd}
</style>
</head>
<body><div class="container">
<h1>14. Random Password Generator</h1>

<input id="len" type="number" value="12" min="4" max="50"><button onclick="generate()">Generate</button><input id="out" readonly style="width:90%">
<script>function generate(){let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';let n=Math.max(4,Math.min(50,+len.value));let s='';for(let i=0;i<n;i++)s+=chars[Math.floor(Math.random()*chars.length)];out.value=s}generate()</script>

</div></body></html>
