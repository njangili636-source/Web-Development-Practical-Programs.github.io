<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6. Weather Application using API</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:25px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{color:#333} button{padding:9px 14px;margin:5px;cursor:pointer;border:0;border-radius:6px;background:#333;color:white}
input,select,textarea{padding:9px;margin:5px;width:auto;max-width:95%}
.output{margin-top:15px;padding:12px;background:#f0f0f0;border-radius:8px}
a{color:#333}
nav{margin-top:25px;padding-top:15px;border-top:1px solid #ddd}
</style>
</head>
<body><div class="container">
<h1>6. Weather Application using API</h1>

<input id="city" placeholder="City name"><button onclick="getWeather()">Get Weather</button><div id="out" class="output">Enter a city.</div>
<script>
async function getWeather(){out.textContent='Loading...';try{
let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city.value)+'&count=1&language=en&format=json').then(r=>r.json());
if(!g.results?.length)throw Error('City not found'); let p=g.results[0];
let w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,wind_speed_10m`).then(r=>r.json());
out.innerHTML=`<b>${p.name}, ${p.country}</b><br>Temperature: ${w.current.temperature_2m} °C<br>Wind: ${w.current.wind_speed_10m} km/h`;
}catch(e){out.textContent='Unable to get weather. Check city name and internet connection.'}}
</script>

</div></body></html>
