<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>10. Expense Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 25px;
            color: #222;
        }
        
        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }
        
        h1 {
            color: #333;
        }
        
        input {
            padding: 10px;
            margin: 5px;
            font-size: 15px;
        }
        
        button {
            padding: 9px 14px;
            margin: 5px;
            cursor: pointer;
            border: 0;
            border-radius: 6px;
            background: #333;
            color: white;
        }
        
        button:hover {
            background: #555;
        }
        
        ul {
            padding-left: 25px;
        }
        
        li {
            margin: 10px 0;
            font-size: 17px;
        }
        
        .delete-btn {
            background: #d9534f;
            font-size: 13px;
        }
        
        .delete-btn:hover {
            background: #c9302c;
        }
        
        .output {
            margin-top: 15px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 8px;
        }
        
        nav {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        
        nav a {
            color: #333;
            margin-right: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>10. Expense Tracker</h1>

        <input type="text" id="expenseName" placeholder="Expense name">

        <input type="number" id="expenseAmount" placeholder="Amount">

        <button onclick="addExpense()">Add</button>

        <ul id="expenseList"></ul>

        <h3>
            Total: ₹<span id="total">0</span>
        </h3>

        <nav>
            <a href="index.html">← Back to Mini Projects</a>
            <a href="../index.html">← Back to JavaScript Programs</a>
        </nav>

    </div>

    <script>
        let total = 0;

        const expenseName = document.getElementById("expenseName");
        const expenseAmount = document.getElementById("expenseAmount");
        const expenseList = document.getElementById("expenseList");
        const totalDisplay = document.getElementById("total");

        function addExpense() {

            let name = expenseName.value.trim();
            let amount = Number(expenseAmount.value);

            // Validate input
            if (name === "" || amount <= 0) {
                alert("Please enter a valid expense name and amount.");
                return;
            }

            // Create list item
            let li = document.createElement("li");

            li.textContent = name + " - ₹" + amount + " ";

            // Create delete button
            let deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";

            deleteButton.onclick = function() {

                total = total - amount;

                totalDisplay.textContent = total;

                li.remove();
            };

            li.appendChild(deleteButton);

            expenseList.appendChild(li);

            // Update total
            total = total + amount;

            totalDisplay.textContent = total;

            // Clear inputs
            expenseName.value = "";
            expenseAmount.value = "";
        }
    </script>

</body>

</html>
