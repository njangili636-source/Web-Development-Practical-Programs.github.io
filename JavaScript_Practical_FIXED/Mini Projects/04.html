<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4. Countdown Timer</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:25px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{color:#333} button{padding:9px 14px;margin:5px;cursor:pointer;border:0;border-radius:6px;background:#333;color:white}
input,select,textarea{padding:9px;margin:5px;width:auto;max-width:95%}
.output{margin-top:15px;padding:12px;background:#f0f0f0;border-radius:8px}
a{color:#333}
nav{margin-top:25px;padding-top:15px;border-top:1px solid #ddd}
</style>
</head>
<body><div class="container">
<h1>4. Countdown Timer</h1>

<input id="sec" type="number" min="1" placeholder="Seconds"><button onclick="start()">Start</button><button onclick="stop()">Stop</button>
<h2 id="out">Enter seconds</h2><script>let id;function start(){stop();let n=Number(sec.value);if(n<=0)return;out.textContent=n;id=setInterval(()=>{n--;out.textContent=n;if(n<=0){stop();out.textContent='Time Up!'}},1000)}function stop(){clearInterval(id)}</script>

</div></body></html>
