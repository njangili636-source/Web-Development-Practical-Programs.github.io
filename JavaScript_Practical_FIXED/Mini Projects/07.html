<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7. Quiz Application</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:25px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{color:#333} button{padding:9px 14px;margin:5px;cursor:pointer;border:0;border-radius:6px;background:#333;color:white}
input,select,textarea{padding:9px;margin:5px;width:auto;max-width:95%}
.output{margin-top:15px;padding:12px;background:#f0f0f0;border-radius:8px}
a{color:#333}
nav{margin-top:25px;padding-top:15px;border-top:1px solid #ddd}
</style>
</head>
<body><div class="container">
<h1>7. Quiz Application</h1>

<h3 id="q"></h3><div id="opts"></div><button onclick="next()">Next</button><h3 id="score"></h3>
<script>
const qs=[['What is HTML?',['Markup language','Database','Operating system'],0],['Which is used for styling?',['HTML','CSS','SQL'],1],['Which runs JavaScript?',['Browser','Printer','Scanner'],0]];
let i=0,s=0;function show(){q.textContent=qs[i][0];opts.innerHTML=qs[i][1].map((x,j)=>`<button onclick="answer(${j})">${x}</button>`).join('');score.textContent='Score: '+s+'/'+qs.length}
function answer(j){if(j===qs[i][2])s++;document.querySelectorAll('#opts button').forEach(b=>b.disabled=true);score.textContent='Score: '+s+'/'+qs.length}
function next(){i++;if(i<qs.length)show();else{q.textContent='Quiz completed!';opts.innerHTML='';score.textContent='Final Score: '+s+'/'+qs.length}}show();
</script>
<nav><a href="index.html">← Back to Mini Projects</a> | <a href="../index.html">← Back to JavaScript Programs</a></nav>
</div></body></html>
