<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. Stopwatch</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:25px;color:#222}
.container{max-width:850px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h1{color:#333} button{padding:9px 14px;margin:5px;cursor:pointer;border:0;border-radius:6px;background:#333;color:white}
input,select,textarea{padding:9px;margin:5px;width:auto;max-width:95%}
.output{margin-top:15px;padding:12px;background:#f0f0f0;border-radius:8px}
a{color:#333}
nav{margin-top:25px;padding-top:15px;border-top:1px solid #ddd}
</style>
</head>
<body><div class="container">
<h1>3. Stopwatch</h1>

<h2 id="display">00:00:00</h2><button onclick="start()">Start</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button>
<script>let t=0,id=null;function render(){let s=t%60,m=Math.floor(t/60)%60,h=Math.floor(t/3600);display.textContent=[h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}
function start(){if(id===null)id=setInterval(()=>{t++;render()},1000)}function stop(){clearInterval(id);id=null}function reset(){stop();t=0;render()}</script>

</div></body></html>
