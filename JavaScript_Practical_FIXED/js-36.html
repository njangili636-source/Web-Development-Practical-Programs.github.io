<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>36. Countdown</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:25px}
.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px #bbb}
input,button,select,textarea{padding:9px;margin:5px;font-size:15px}
button{cursor:pointer}
.output{margin-top:15px;padding:12px;background:#eee;border-radius:6px;min-height:20px}
nav{margin-top:25px}
nav a{margin-right:18px}
</style>
</head>
<body><div class="box">
<h1>36. Countdown</h1>
<p>Count down from a chosen number.</p>
<input id="n" type="number" value="10" min="1"><button onclick="start()">Start</button><h2 id="out"></h2>
<nav><a href="index.html">Back to Programs</a> <a href="../index.html">Home</a></nav>
</div>
<script>let timer;function start(){clearInterval(timer);let n=+document.getElementById('n').value;out.textContent=n;timer=setInterval(()=>{n--;out.textContent=n;if(n<=0)clearInterval(timer)},1000)}</script>
</body>
</html>
