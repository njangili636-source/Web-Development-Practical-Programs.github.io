<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>44. Display API Data Dynamically</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:25px}
.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px #bbb}
input,button,select,textarea{padding:9px;margin:5px;font-size:15px}
button{cursor:pointer}
.output{margin-top:15px;padding:12px;background:#eee;border-radius:6px;min-height:20px}
nav{margin-top:25px}
nav a{margin-right:18px}
</style>
</head>
<body><div class="box">
<h1>44. Display API Data Dynamically</h1>
<p>Fetch and display API data.</p>
<button onclick="run()">Load Data</button><div id="out" class="output"></div>
<nav><a href="index.html">Back to Programs</a> <a href="../index.html">Home</a></nav>
</div>
<script>async function run(){try{let r=await fetch('https://jsonplaceholder.typicode.com/users/1');let d=await r.json();out.innerHTML=`Name: ${d.name}<br>Email: ${d.email}`}catch(e){out.textContent='API request failed'}}</script>
</body>
</html>
