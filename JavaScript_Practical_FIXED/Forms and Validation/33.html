<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>33. Multi-Step Registration Form</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:30px auto;padding:20px;background:#f5f5f5}
.box{background:white;padding:25px;border-radius:10px;box-shadow:0 2px 8px #ccc}
input,select,textarea,button{padding:9px;margin:6px 0;width:100%;box-sizing:border-box}
button{cursor:pointer;width:auto;background:#333;color:white;border:0;border-radius:5px;padding:10px 16px}
label{font-weight:bold;display:block;margin-top:10px}
.error{color:#c00;font-size:14px}.success{color:green;font-weight:bold}
table{border-collapse:collapse;width:100%;margin-top:15px}th,td{border:1px solid #aaa;padding:8px}
nav{margin-bottom:15px}nav a{margin-right:15px}
.step{display:none}.step.active{display:block}
.preview{background:#eee;padding:15px;margin-top:15px}
</style>
</head>
<body><nav><a href="index.html">Back to Forms & Validation</a> <a href="../index.html">Back to JavaScript Programs</a></nav>
<div class="box"><h1>33. Multi-Step Registration Form</h1>
<form id="f">
<div class="step active" id="s1"><h2>Step 1</h2><input id="n" placeholder="Name"><input id="e" type="email" placeholder="Email"><button type="button" onclick="next()">Next</button></div>
<div class="step" id="s2"><h2>Step 2</h2><input id="p" type="password" placeholder="Password"><input id="c" type="password" placeholder="Confirm password"><button type="button" onclick="back()">Back</button><button type="submit">Register</button></div>
</form><p id="o"></p>
</div>
<script>function next(){if(n.value.trim()&&e.checkValidity()){s1.classList.remove("active");s2.classList.add("active")}else{o.textContent="Enter a valid name and email";o.className="error"}}function back(){s2.classList.remove("active");s1.classList.add("active")}f.onsubmit=e=>{e.preventDefault();let ok=p.value.length>=6&&p.value===c.value;o.textContent=ok?"Registration completed!":"Password must be 6+ characters and match.";o.className=ok?"success":"error"}</script></body></html>
