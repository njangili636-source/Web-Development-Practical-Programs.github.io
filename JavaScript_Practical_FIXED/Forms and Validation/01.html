<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>1. Student Registration Form</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:30px auto;padding:20px;background:#f5f5f5}
.box{background:white;padding:25px;border-radius:10px;box-shadow:0 2px 8px #ccc}
input,select,textarea,button{padding:9px;margin:6px 0;width:100%;box-sizing:border-box}
button{cursor:pointer;width:auto;background:#333;color:white;border:0;border-radius:5px;padding:10px 16px}
label{font-weight:bold;display:block;margin-top:10px}
.error{color:#c00;font-size:14px}.success{color:green;font-weight:bold}
table{border-collapse:collapse;width:100%;margin-top:15px}th,td{border:1px solid #aaa;padding:8px}
nav{margin-bottom:15px}nav a{margin-right:15px}
.step{display:none}.step.active{display:block}
.preview{background:#eee;padding:15px;margin-top:15px}
</style>
</head>
<body><nav><a href="index.html">Back to Forms & Validation</a> <a href="../index.html">Back to JavaScript Programs</a></nav>
<div class="box"><h1>1. Student Registration Form</h1>
<form id="f">
<label>Name</label><input id="name">
<label>Email</label><input id="email">
<label>Age</label><input id="age" type="number">
<label>Mobile</label><input id="mobile">
<label>Password</label><input id="pass" type="password">
<button>Register</button></form><p id="out"></p>
</div>
<script>
f.onsubmit=e=>{e.preventDefault();let n=name.value.trim(),em=email.value.trim(),a=+age.value,m=mobile.value,p=pass.value;
let errs=[];if(!/^[A-Za-z ]+$/.test(n))errs.push("Name");if(!/^\S+@\S+\.\S+$/.test(em))errs.push("Email");
if(a<18)errs.push("Age");if(!/^\d{10}$/.test(m))errs.push("Mobile");if(p.length<6)errs.push("Password");
out.className=errs.length?"error":"success";out.textContent=errs.length?"Invalid: "+errs.join(", "):"Registration successful!";}
</script></body></html>
