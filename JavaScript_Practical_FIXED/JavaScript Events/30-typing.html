<style>
body{font-family:Arial;max-width:850px;margin:40px auto;padding:20px;line-height:1.6}
button,input,select{padding:10px;margin:5px} #box,#area{padding:40px;background:#eee;border:2px solid #333;text-align:center}
#target{width:220px;height:100px;background:#ddd;padding:30px} #drag{width:100px;padding:20px;background:skyblue;cursor:grab}

<h1>Question 30: Typing Test</h1><p>Type the given sentence and check your time.</p>
<p id="target">JavaScript is easy to learn.</p><input id="x" style="width:90%"><button id="b">Check</button><p id="out"></p><script>let start; x.onfocus=()=>start=Date.now();b.onclick=()=>out.textContent=x.value===target.textContent?"Time: "+((Date.now()-start)/1000).toFixed(2)+" seconds":"Text does not match";</script>
