<h1>Question 20: removeEventListener()</h1><p>Click Add, then Remove, then click the button.</p>
<button id="add">Add Listener</button> <button id="remove">Remove Listener</button> <button id="test">Test</button><p id="out"></p><script>function hello(){out.textContent="Listener is active";}add.onclick=()=>{test.addEventListener("click",hello);out.textContent="Added";};remove.onclick=()=>{test.removeEventListener("click",hello);out.textContent="Removed";};</script>
