<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Question 26 - Keyboard Controlled Object</title>
<style>
body{font-family:Arial;max-width:850px;margin:40px auto;padding:20px;line-height:1.6}
button,input,select{padding:10px;margin:5px} #box,#area{padding:40px;background:#eee;border:2px solid #333;text-align:center}
#target{width:220px;height:100px;background:#ddd;padding:30px} #drag{width:100px;padding:20px;background:skyblue;cursor:grab} 
#area{height:220px;position:relative} #obj{width:30px;height:30px;background:red;position:absolute;left:10px;top:10px}
</style></head><body>
<h1>Question 26: Keyboard Controlled Object</h1><p>Use arrow keys to move the box.</p>
<div id="area"><div id="obj"></div></div><p>Use Arrow Keys</p><script>let x=10,y=10;document.onkeydown=e=>{if(e.key==="ArrowRight")x+=10;if(e.key==="ArrowLeft")x-=10;if(e.key==="ArrowDown")y+=10;if(e.key==="ArrowUp")y-=10;obj.style.left=x+"px";obj.style.top=y+"px";};</script>
<p><a href="index.html">Back to JavaScript Events</a> | <a href="../index.html">Home</a></p>
</body></html>
