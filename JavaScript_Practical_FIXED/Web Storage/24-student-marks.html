<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>24. Student Marks Database using localStorage</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #ccc}
input,button,select{padding:9px;margin:5px}
button{cursor:pointer}
#output{margin-top:15px;padding:12px;background:#eef2f5;border-radius:8px;min-height:25px}
a{margin-right:15px}
</style>
</head>
<body><div class="card">
<h1>24. Student Marks Database using localStorage</h1>
<p>Store student marks and display them.</p>
<input id="name" placeholder="Student Name"><input id="marks" type="number" placeholder="Marks"><button onclick="add()">Add</button><button onclick="show()">Show Database</button>
<div id="output"></div>
<hr>
<a href="index.html">Back to Web Storage Programs</a>
<a href="../index.html">Back to JavaScript Programs</a>
</div>
<script>
function add(){let a=JSON.parse(localStorage.getItem('marksDB')||'[]');a.push({name:name.value,marks:Number(marks.value)});localStorage.setItem('marksDB',JSON.stringify(a));output.textContent='Record saved.';}function show(){let a=JSON.parse(localStorage.getItem('marksDB')||'[]');output.innerHTML=a.map(x=>x.name+' - '+x.marks).join('<br>')||'No records';}
</script>
</body></html>
