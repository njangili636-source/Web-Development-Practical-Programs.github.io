<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>13. Login Preference System</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #ccc}
input,button,select{padding:9px;margin:5px}
button{cursor:pointer}
#output{margin-top:15px;padding:12px;background:#eef2f5;border-radius:8px;min-height:25px}
a{margin-right:15px}
</style>
</head>
<body><div class="card">
<h1>13. Login Preference System</h1>
<p>Save whether the user wants to stay logged in.</p>
<label><input type="checkbox" id="remember"> Remember me</label><button onclick="save()">Save Preference</button>
<div id="output"></div>
<hr>
<a href="index.html">Back to Web Storage Programs</a>
<a href="../index.html">Back to JavaScript Programs</a>
</div>
<script>
function save(){localStorage.setItem('remember',remember.checked);output.textContent='Remember me: '+remember.checked;}
</script>
</body></html>
