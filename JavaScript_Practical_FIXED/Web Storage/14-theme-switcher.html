<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>14. Dark/Light Theme Switcher</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #ccc}
input,button,select{padding:9px;margin:5px}
button{cursor:pointer}
#output{margin-top:15px;padding:12px;background:#eef2f5;border-radius:8px;min-height:25px}
a{margin-right:15px}
</style>
</head>
<body><div class="card">
<h1>14. Dark/Light Theme Switcher</h1>
<p>Theme preference is saved in localStorage.</p>
<button onclick="toggle()">Toggle Theme</button>
<div id="output"></div>
<hr>
<a href="index.html">Back to Web Storage Programs</a>
<a href="../index.html">Back to JavaScript Programs</a>
</div>
<script>
function apply(){document.body.style.background=localStorage.getItem('theme')==='dark'?'#222':'#f5f5f5';document.body.style.color=localStorage.getItem('theme')==='dark'?'white':'black';}function toggle(){localStorage.setItem('theme',localStorage.getItem('theme')==='dark'?'light':'dark');apply();}apply();
</script>
</body></html>
