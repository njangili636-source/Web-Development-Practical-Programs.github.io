<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>9. Student Record System</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #ccc}
input,button,select{padding:9px;margin:5px}
button{cursor:pointer}
#output{margin-top:15px;padding:12px;background:#eef2f5;border-radius:8px;min-height:25px}
a{margin-right:15px}
</style>
</head>
<body><div class="card">
<h1>9. Student Record System</h1>
<p>Add and display student records.</p>
<input id="name" placeholder="Name"><input id="roll" placeholder="Roll No"><button onclick="add()">Add</button><button onclick="show()">Show Records</button>
<div id="output"></div>
<hr>
<a href="index.html">Back to Web Storage Programs</a>
<a href="../index.html">Back to JavaScript Programs</a>
</div>
<script>
function add(){let a=JSON.parse(localStorage.getItem('students')||'[]');a.push({name:name.value,roll:roll.value});localStorage.setItem('students',JSON.stringify(a));name.value='';roll.value='';output.textContent='Student added.';} function show(){let a=JSON.parse(localStorage.getItem('students')||'[]');output.innerHTML=a.map(s=>s.roll+' - '+s.name).join('<br>')||'No records';}
</script>
</body></html>
