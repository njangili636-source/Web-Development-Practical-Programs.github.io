<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>7. Store an Array using JSON</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #ccc}
input,button,select{padding:9px;margin:5px}
button{cursor:pointer}
#output{margin-top:15px;padding:12px;background:#eef2f5;border-radius:8px;min-height:25px}
a{margin-right:15px}
</style>
</head>
<body><div class="card">
<h1>7. Store an Array using JSON</h1>
<p>Store an array in localStorage.</p>
<button onclick="save()">Save Array</button><button onclick="show()">Show Array</button>
<div id="output"></div>
<hr>
<a href="index.html">Back to Web Storage Programs</a>
<a href="../index.html">Back to JavaScript Programs</a>
</div>
<script>
function save(){localStorage.setItem('fruits',JSON.stringify(['Apple','Mango','Orange']));output.textContent='Array stored using JSON.';} function show(){output.textContent=JSON.parse(localStorage.getItem('fruits')||'[]').join(', ');}
</script>
</body></html>
