<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>17. Visitor Counter using Browser Storage</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #ccc}
input,button,select{padding:9px;margin:5px}
button{cursor:pointer}
#output{margin-top:15px;padding:12px;background:#eef2f5;border-radius:8px;min-height:25px}
a{margin-right:15px}
</style>
</head>
<body><div class="card">
<h1>17. Visitor Counter using Browser Storage</h1>
<p>Each page load increments the local visitor counter.</p>
<p>Refresh the page to increase the counter.</p>
<div id="output"></div>
<hr>
<a href="index.html">Back to Web Storage Programs</a>
<a href="../index.html">Back to JavaScript Programs</a>
</div>
<script>
let n=Number(localStorage.getItem('visits')||0)+1;localStorage.setItem('visits',n);output.textContent='Visitor count: '+n;
</script>
</body></html>
