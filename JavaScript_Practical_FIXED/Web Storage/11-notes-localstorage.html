<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>11. Notes Application using localStorage</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #ccc}
input,button,select{padding:9px;margin:5px}
button{cursor:pointer}
#output{margin-top:15px;padding:12px;background:#eef2f5;border-radius:8px;min-height:25px}
a{margin-right:15px}
</style>
</head>
<body><div class="card">
<h1>11. Notes Application using localStorage</h1>
<p>Save a note and retrieve it later.</p>
<textarea id="note" rows="6" cols="60" placeholder="Write your note"></textarea><br><button onclick="save()">Save Note</button><button onclick="load()">Load Note</button><button onclick="del()">Delete Note</button>
<div id="output"></div>
<hr>
<a href="index.html">Back to Web Storage Programs</a>
<a href="../index.html">Back to JavaScript Programs</a>
</div>
<script>
function save(){localStorage.setItem('note',note.value);output.textContent='Note saved.';}function load(){note.value=localStorage.getItem('note')||'';output.textContent='Note loaded.';}function del(){localStorage.removeItem('note');note.value='';output.textContent='Note deleted.';}
</script>
</body></html>
