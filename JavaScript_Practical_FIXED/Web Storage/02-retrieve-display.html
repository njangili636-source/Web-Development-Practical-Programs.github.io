<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2. Retrieve and Display localStorage Data</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #ccc}
input,button,select{padding:9px;margin:5px}
button{cursor:pointer}
#output{margin-top:15px;padding:12px;background:#eef2f5;border-radius:8px;min-height:25px}
a{margin-right:15px}
</style>
</head>
<body><div class="card">
<h1>2. Retrieve and Display localStorage Data</h1>
<p>Retrieve the saved username.</p>
<button onclick="show()">Retrieve</button>
<div id="output"></div>
<hr>
<a href="index.html">Back to Web Storage Programs</a>
<a href="../index.html">Back to JavaScript Programs</a>
</div>
<script>
function show(){output.textContent='Username: '+(localStorage.getItem('username')||'No username stored');}
</script>
</body></html>
