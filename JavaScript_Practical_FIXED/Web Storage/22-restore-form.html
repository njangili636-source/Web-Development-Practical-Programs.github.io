<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>22. Restore Form Data after Refresh</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #ccc}
input,button,select{padding:9px;margin:5px}
button{cursor:pointer}
#output{margin-top:15px;padding:12px;background:#eef2f5;border-radius:8px;min-height:25px}
a{margin-right:15px}
</style>
</head>
<body><div class="card">
<h1>22. Restore Form Data after Refresh</h1>
<p>Previously entered values are restored.</p>
<input id="name" placeholder="Name"><input id="email" placeholder="Email"><button onclick="clearData()">Clear Saved Data</button>
<div id="output"></div>
<hr>
<a href="index.html">Back to Web Storage Programs</a>
<a href="../index.html">Back to JavaScript Programs</a>
</div>
<script>
name.value=localStorage.getItem('restoreName')||'';email.value=localStorage.getItem('restoreEmail')||'';name.oninput=()=>localStorage.setItem('restoreName',name.value);email.oninput=()=>localStorage.setItem('restoreEmail',email.value);function clearData(){localStorage.removeItem('restoreName');localStorage.removeItem('restoreEmail');name.value='';email.value='';}
</script>
</body></html>
