<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>60. Common Elements in Two Arrays</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:25px}
.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px #bbb}
input,button,select,textarea{padding:9px;margin:5px;font-size:15px}
button{cursor:pointer}
.output{margin-top:15px;padding:12px;background:#eee;border-radius:6px;min-height:20px}
nav{margin-top:25px}
nav a{margin-right:18px}
</style>
</head>
<body><div class="box">
<h1>60. Common Elements in Two Arrays</h1>
<p>Find common elements in two arrays.</p>
<input id="a" value="1,2,3,4,5"><input id="b" value="3,4,5,6,7"><button onclick="run()">Run</button><div id="out" class="output"></div>
<nav><a href="index.html">Back to Programs</a> <a href="../index.html">Home</a></nav>
</div>
<script>function run(){let x=a.value.split(',').map(Number),y=new Set(b.value.split(',').map(Number));out.textContent='Common Elements: '+x.filter(v=>y.has(v)).join(', ')}</script>
</body>
</html>
