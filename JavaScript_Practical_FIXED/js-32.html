<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>32. To-Do List</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:25px}
.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px #bbb}
input,button,select,textarea{padding:9px;margin:5px;font-size:15px}
button{cursor:pointer}
.output{margin-top:15px;padding:12px;background:#eee;border-radius:6px;min-height:20px}
nav{margin-top:25px}
nav a{margin-right:18px}
</style>
</head>
<body><div class="box">
<h1>32. To-Do List</h1>
<p>Add and remove tasks.</p>
<input id="task" placeholder="Task"><button onclick="add()">Add</button><ul id="list"></ul>
<nav><a href="index.html">Back to Programs</a> <a href="../index.html">Home</a></nav>
</div>
<script>function add(){if(task.value.trim()){let li=document.createElement('li');li.textContent=task.value+' (click to delete)';li.onclick=()=>li.remove();list.appendChild(li);task.value=''}}</script>
</body>
</html>
