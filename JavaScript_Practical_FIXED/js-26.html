<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>26. Change Image</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 25px;
        }
        
        .box {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #bbb;
        }
        
        button {
            padding: 10px 18px;
            margin-top: 15px;
            font-size: 15px;
            cursor: pointer;
        }
        
        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            display: block;
            margin-top: 20px;
        }
        
        nav {
            margin-top: 25px;
        }
        
        nav a {
            margin-right: 18px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>26. Change Image</h1>

        <p>Change an image when a button is clicked.</p>

        <img id="myImage" src="https://placehold.co/220x220?text=Image+1" alt="Image 1">

        <button onclick="changeImage()">Change Image</button>

        <nav>
            <a href="index.html">Back to Programs</a>
            <a href="../index.html">Home</a>
        </nav>

    </div>

    <script>
        function changeImage() {

            document.getElementById("myImage").src =
                "https://placehold.co/220x220?text=Image+2";

        }
    </script>

</body>

</html>
