<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>33. Quiz App</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:25px}
.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px #bbb}
input,button,select,textarea{padding:9px;margin:5px;font-size:15px}
button{cursor:pointer}
.output{margin-top:15px;padding:12px;background:#eee;border-radius:6px;min-height:20px}
nav{margin-top:25px}
nav a{margin-right:18px}
</style>
</head>
<body><div class="box">
<h1>33. Quiz App</h1>
<p>Answer a simple quiz question.</p>
<p>What is 2 + 2?</p><button onclick="answer(4)">4</button><button onclick="answer(5)">5</button><div id="out" class="output"></div>
<nav><a href="index.html">Back to Programs</a> <a href="../index.html">Home</a></nav>
</div>
<script>function answer(x){out.textContent=x===4?'Correct!':'Wrong answer.'}</script>
</body>
</html>
