<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. Largest of Three</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:25px}
.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px #bbb}
input,button,select,textarea{padding:9px;margin:5px;font-size:15px}
button{cursor:pointer}
.output{margin-top:15px;padding:12px;background:#eee;border-radius:6px;min-height:20px}

nav a{margin-right:18px}
</style>
</head>
<body><div class="box">
<h1>3. Largest of Three</h1>
<p>Find the largest of three numbers.</p>
<input id="a" type="number" value="10"><input id="b" type="number" value="25"><input id="c" type="number" value="15"><button onclick="run()">Run Program</button><div id="out" class="output"></div>
<nav><a href="index.html">Back to Programs</a> <a href="../index.html">Home</a></nav>
</div>
<script>function run(){out.textContent='Largest = '+Math.max(+a.value,+b.value,+c.value)}</script>
</body>
</html>
