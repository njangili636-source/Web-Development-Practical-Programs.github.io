<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>31. Validate Name, Email, Phone and Password</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:25px}
.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px #bbb}
input,button,select,textarea{padding:9px;margin:5px;font-size:15px}
button{cursor:pointer}
.output{margin-top:15px;padding:12px;background:#eee;border-radius:6px;min-height:20px}
nav{margin-top:25px}
nav a{margin-right:18px}
</style>
</head>
<body><div class="box">
<h1>31. Validate Name, Email, Phone and Password</h1>
<p>Validate common form fields.</p>
<input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="phone" placeholder="10-digit phone"><input id="pass" type="password" placeholder="6+ char password"><button onclick="run()">Validate</button><div id="out" class="output"></div>
<nav><a href="index.html">Back to Programs</a> <a href="../index.html">Home</a></nav>
</div>
<script>function run(){let ok=/^[A-Za-z ]+$/.test(name.value)&&/^\S+@\S+\.\S+$/.test(email.value)&&/^\d{10}$/.test(phone.value)&&pass.value.length>=6;out.textContent=ok?'All fields are valid':'Please check the entered fields'}</script>
</body>
</html>
