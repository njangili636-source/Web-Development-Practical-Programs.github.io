<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>18. Demonstrate Browser Geolocation</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px #ccc}
button,input{padding:9px;margin:5px}#output{margin-top:15px;padding:12px;background:#eef2f5;border-radius:8px;min-height:25px}
a{margin-right:15px}
</style></head><body><div class="card">
<h1>18. Demonstrate Browser Geolocation</h1><p>Request the user's location using the Geolocation API. Browser permission is required.</p><button onclick="getLocation()">Get My Location</button><div id="output"></div><hr>
<a href="index.html">Back to Browser Objects Programs</a>
<a href="../index.html">Back to JavaScript Programs</a>
</div><script>function getLocation(){if(!navigator.geolocation){output.textContent='Geolocation is not supported.';return}output.textContent='Requesting location permission...';navigator.geolocation.getCurrentPosition(p=>output.textContent='Location permission granted. Latitude: '+p.coords.latitude+' | Longitude: '+p.coords.longitude,e=>output.textContent='Location unavailable or permission denied.');}</script></body></html>
