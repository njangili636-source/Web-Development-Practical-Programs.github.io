<h1>7. Stopwatch</h1><p>Start, stop and reset the stopwatch.</p><h2 id="watch">00:00:00</h2><button onclick="start()">Start</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button><div id="output"></div><hr>
<a href="index.html">Back to Browser Objects Programs</a>

</div><script>let s=0,t;function show(){let h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s/60)%60).padStart(2,'0'),x=String(s%60).padStart(2,'0');watch.textContent=h+':'+m+':'+x}function start(){if(!t)t=setInterval(()=>{s++;show()},1000)}function stop(){clearInterval(t);t=null}function reset(){stop();s=0;show()}show();</script></body></html>
