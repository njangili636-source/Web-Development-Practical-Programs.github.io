<h1>2. alert(), confirm(), and prompt()</h1><p>Demonstrate three Window dialog methods.</p><button onclick="alertDemo()">Alert</button><button onclick="confirmDemo()">Confirm</button><button onclick="promptDemo()">Prompt</button><div id="output"></div><hr>

</div><script>function alertDemo(){alert('Hello! This is an alert.');output.textContent='Alert displayed.';}function confirmDemo(){let x=confirm('Do you want to continue?');output.textContent='Confirm result: '+x;}function promptDemo(){let x=prompt('Enter your name:');output.textContent=x?'Hello, '+x:'No name entered.';}</script></body></html>
