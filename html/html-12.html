<head>
    <meta charset="UTF-8">

    <title>HTML Program 12</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        
        h1 {
            color: blue;
        }
        
        .text {
            color: green;
            font-size: 20px;
        }
        
        #box {
            background-color: lightgray;
            border: 3px solid black;
            margin: 20px;
            padding: 20px;
        }
        
        p {
            font-family: Georgia, serif;
        }
    </style>

</head>

<body>

    <h1>CSS Selectors and Properties</h1>

    <p class="text">
        This paragraph demonstrates CSS colors and fonts.
    </p>

    <div id="box">

        <h2>CSS Box</h2>

        <p>
            This box demonstrates margin, padding, border, background color and font properties.
        </p>

    </div>
