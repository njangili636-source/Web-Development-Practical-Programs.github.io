<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Program 13</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }
        
        header {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
        }
        
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        
        .box {
            flex: 1;
            background-color: lightgray;
            padding: 30px;
            text-align: center;
        }
        /* Responsive design */
        
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
            header h1 {
                font-size: 24px;
            }
            .box {
                padding: 20px;
            }
        }
    </style>

</head>

<body>

    <header>
        <h1>Responsive Webpage</h1>
        <p>Resize the browser window to see the effect.</p>
    </header>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>Structure of webpage</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>Design of webpage</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>Functionality of webpage</p>
        </div>

    </div>

    <br>

    <a href="index.html">Back to Programs</a>
    <br><br>

    <a href="../index.html">Home</a>

</body>

</html>
